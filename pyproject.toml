[project]
name = "soniox-translate-demo"
version = "0.1.0"
description = "Real-time two-way speech-to-speech translation demo (Soniox STT translation + TTS)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "websockets>=13",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "sounddevice>=0.5",
    "soundfile>=0.13",
]
